# =============================================================================
# Quarkus module builder — Pipeline for the demo.
# Builds one Maven module from sansow/coolstore-quarkus, packages with buildah,
# pushes to the internal OpenShift registry. ACS scan + cosign + GitOps bump
# can be layered on later.
# =============================================================================
---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: quarkus-module-build
  namespace: coolstore-cicd
spec:
  params:
    - { name: git-url,      default: 'https://github.com/sansow/coolstore-quarkus.git' }
    - { name: git-revision, default: 'main' }
    - { name: module,       description: 'maven module name (e.g. catalog-service)' }
    - { name: image-name,   description: 'full image ref without tag' }
    - { name: image-tag,    default: 'latest' }
  workspaces:
    - { name: source }
    - { name: maven-settings }
  tasks:
    - name: fetch
      taskRef: { name: git-clone, kind: ClusterTask }
      workspaces:
        - { name: output, workspace: source }
      params:
        - { name: url,            value: $(params.git-url) }
        - { name: revision,       value: $(params.git-revision) }
        - { name: deleteExisting, value: 'true' }
    - name: build-jar
      runAfter: [fetch]
      taskRef: { name: maven, kind: ClusterTask }
      workspaces:
        - { name: source,         workspace: source }
        - { name: maven-settings, workspace: maven-settings }
      params:
        - name: GOALS
          value:
            - clean
            - package
            - -pl
            - $(params.module)
            - -am
            - -DskipTests
    - name: build-image
      runAfter: [build-jar]
      taskRef: { name: buildah, kind: ClusterTask }
      workspaces:
        - { name: source, workspace: source }
      params:
        - { name: IMAGE,          value: '$(params.image-name):$(params.image-tag)' }
        - { name: DOCKERFILE,     value: '$(params.module)/src/main/docker/Dockerfile.jvm' }
        - { name: CONTEXT,        value: '$(params.module)' }
        - { name: TLSVERIFY,      value: 'false' }
        - { name: STORAGE_DRIVER, value: 'vfs' }
