# =============================================================================
# RHACM Policies — fleet-wide guardrails. These give the CTO the "every cluster
# looks the same and stays compliant" headline.
# =============================================================================
---
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: coolstore-baseline
  namespace: coolstore-policies
  annotations:
    policy.open-cluster-management.io/standards: NIST SP 800-53
    policy.open-cluster-management.io/categories: SI System and Information Integrity
    policy.open-cluster-management.io/controls: SI-2 Flaw Remediation
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: require-coolstore-namespaces
        spec:
          remediationAction: enforce
          severity: high
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Namespace
                metadata:
                  name: coolstore
                  labels:
                    pod-security.kubernetes.io/enforce: restricted
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: require-coolstore-network-policy
        spec:
          remediationAction: enforce
          severity: high
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: networking.k8s.io/v1
                kind: NetworkPolicy
                metadata:
                  name: default-deny
                  namespace: coolstore
                spec:
                  podSelector: {}
                  policyTypes: [Ingress]
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: bind-coolstore-baseline
  namespace: coolstore-policies
placementRef:
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
  name: all-coolstore-clusters
subjects:
  - apiGroup: policy.open-cluster-management.io
    kind: Policy
    name: coolstore-baseline
---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: all-coolstore-clusters
  namespace: coolstore-policies
spec:
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchLabels:
            usage: coolstore
