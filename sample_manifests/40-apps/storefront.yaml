# =============================================================================
# Container workloads — the storefront UI and the two transactional APIs.
# Image references are placeholders; in your fork, point them at quay.io/<org>/...
# =============================================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  namespace: coolstore
  labels:
    app.kubernetes.io/name: storefront
    app.kubernetes.io/part-of: coolstore
    app.kubernetes.io/component: ui
spec:
  replicas: 2
  selector: { matchLabels: { app.kubernetes.io/name: storefront } }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: storefront
    spec:
      containers:
        - name: storefront
          image: quay.io/coolstore/storefront:latest
          ports: [{ containerPort: 8080 }]
          env:
            - { name: CATALOG_URL, value: http://catalog.coolstore.svc:8080 }
            - { name: CART_URL,    value: http://cart.coolstore.svc:8080 }
            - { name: ORDER_URL,   value: http://order.coolstore.svc.cluster.local }
            - { name: RECOMMEND_URL, value: http://recommend.coolstore.svc.cluster.local }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 512Mi }
          readinessProbe:
            httpGet: { path: /q/health/ready, port: 8080 }
          livenessProbe:
            httpGet: { path: /q/health/live, port: 8080 }
---
apiVersion: v1
kind: Service
metadata:
  name: storefront
  namespace: coolstore
spec:
  selector: { app.kubernetes.io/name: storefront }
  ports: [{ port: 8080, targetPort: 8080 }]
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: storefront
  namespace: coolstore
spec:
  to: { kind: Service, name: storefront }
  port: { targetPort: 8080 }
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: storefront
  namespace: coolstore
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: storefront
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 65 } }
---
# Catalog API — Quarkus
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: coolstore
  labels:
    app.kubernetes.io/name: catalog
    app.kubernetes.io/part-of: coolstore
spec:
  replicas: 2
  selector: { matchLabels: { app.kubernetes.io/name: catalog } }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalog
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/q/metrics"
    spec:
      containers:
        - name: catalog
          image: quay.io/coolstore/catalog:latest
          ports: [{ containerPort: 8080, name: http }]
          env:
            - { name: QUARKUS_DATASOURCE_JDBC_URL, value: "jdbc:postgresql://postgres.coolstore-virt.svc:5432/coolstoredb" }
            - name: QUARKUS_DATASOURCE_USERNAME
              valueFrom: { secretKeyRef: { name: postgres-app, key: username } }
            - name: QUARKUS_DATASOURCE_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres-app, key: password } }
          readinessProbe: { httpGet: { path: /q/health/ready, port: 8080 } }
          livenessProbe:  { httpGet: { path: /q/health/live,  port: 8080 } }
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: coolstore
  labels: { app.kubernetes.io/name: catalog }
spec:
  selector: { app.kubernetes.io/name: catalog }
  ports: [{ port: 8080, targetPort: 8080, name: http }]
---
# Cart API — Quarkus
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart
  namespace: coolstore
  labels:
    app.kubernetes.io/name: cart
    app.kubernetes.io/part-of: coolstore
spec:
  replicas: 2
  selector: { matchLabels: { app.kubernetes.io/name: cart } }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cart
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/q/metrics"
    spec:
      containers:
        - name: cart
          image: quay.io/coolstore/cart:latest
          ports: [{ containerPort: 8080, name: http }]
          env:
            - { name: QUARKUS_DATASOURCE_JDBC_URL, value: "jdbc:postgresql://postgres.coolstore-virt.svc:5432/coolstoredb" }
            - name: QUARKUS_DATASOURCE_USERNAME
              valueFrom: { secretKeyRef: { name: postgres-app, key: username } }
            - name: QUARKUS_DATASOURCE_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres-app, key: password } }
---
apiVersion: v1
kind: Service
metadata:
  name: cart
  namespace: coolstore
  labels: { app.kubernetes.io/name: cart }
spec:
  selector: { app.kubernetes.io/name: cart }
  ports: [{ port: 8080, targetPort: 8080, name: http }]
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-app
  namespace: coolstore
type: Opaque
stringData:
  username: coolstore
  password: changeme-in-vault
